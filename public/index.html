<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>תוכנית אימון</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#EDF0EB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="תוכנית אימון">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&family=Assistant:wght@400;600;700&display=swap">
<style>
/* Layout: one-column phone app; home = plan list + sticky start, run = illustrated stage, big counter, thumb controls */
:root{
  --bg:#EDF0EB; --surface:#FFFFFF; --ink:#16211C; --muted:#5D6A63; --line:#D3DAD4; --blob:#E4EAF6;
  --warm:#D9661A; --work:#2B4CDB; --rest:#5F7186; --stretch:#23885C; --ready:#7A5BD0;
  --on-accent:#FFFFFF; --shadow:rgba(30,40,70,.12); --groundc:#E2E3E6; --stage:#F7F7F7;
  --display:"Rubik", "Arial Hebrew", Arial, sans-serif;
  --body:"Assistant", "Arial Hebrew", Arial, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1417; --surface:#182026; --ink:#E9EFEB; --muted:#9AA8A1; --line:#2A353C; --blob:#22303B;
  --warm:#F08A3E; --work:#7D93FF; --rest:#93A3B6; --stretch:#4CC08A; --ready:#A88BF2; --on-accent:#0F1417; --shadow:rgba(0,0,0,.35); --groundc:#2B343C; --stage:#1B2329; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1417; --surface:#182026; --ink:#E9EFEB; --muted:#9AA8A1; --line:#2A353C; --blob:#22303B;
  --warm:#F08A3E; --work:#7D93FF; --rest:#93A3B6; --stretch:#4CC08A; --ready:#A88BF2; --on-accent:#0F1417; --shadow:rgba(0,0,0,.35); --groundc:#2B343C; --stage:#1B2329; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
#app{height:100%;direction:rtl;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:560px;margin:0 auto;box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--work);outline-offset:2px}

/* Home */
#home{padding-block:20px 120px}
.brand{display:flex;flex-direction:column;gap:2px;margin-bottom:18px}
.brandtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand small{font-family:var(--display);font-weight:500;color:var(--muted);letter-spacing:.04em;font-size:13px}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(34px,10vw,46px);line-height:1.05;margin:0;text-wrap:balance}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.meta span{font-family:var(--display);font-weight:500;font-size:14px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums}
.sec{margin-top:22px}
.sec h3{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:15px;margin:0 0 8px;color:var(--muted);letter-spacing:.02em}
.sec h3 i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.row{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;padding:6px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.thumb{width:52px;height:52px;border-radius:12px;background:var(--stage);box-sizing:border-box;overflow:hidden}
.thumb svg{width:100%;height:100%;display:block}
.row b{font-weight:700;font-size:16px;min-width:0}
.row em{font-style:normal;color:var(--muted);font-size:14px;font-family:var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.settings{margin-top:22px;display:grid;gap:12px}
.set{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.set label{font-weight:600}
.chips{display:flex;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-family:var(--display);font-size:14px;font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.startbar{position:fixed;inset:auto 0 0 0;padding:12px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}
.startbar button{display:block;width:100%;max-width:528px;margin:0 auto;border:0;border-radius:16px;background:var(--work);color:var(--on-accent);font-family:var(--display);font-weight:800;font-size:22px;padding:16px}

/* Run */
#run{height:100%;display:flex;flex-direction:column;padding-block:12px 16px;box-sizing:border-box;--c:var(--work)}
.runbar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.iconbtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.phase{font-family:var(--display);font-weight:700;font-size:14px;padding:5px 12px;border-radius:999px;background:var(--c);color:var(--on-accent)}
.stepnum{font-family:var(--display);color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;min-width:42px;text-align:left}
.pbar{height:5px;background:var(--line);border-radius:99px;margin-top:10px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--ink);border-radius:99px;transition:width .3s}
.stage{flex:1 1 auto;min-height:0;display:grid;place-items:center;position:relative;padding-block:8px}
.ringbox{position:relative;height:100%;max-height:min(86vw,430px);aspect-ratio:1;max-width:100%;background:var(--stage);border-radius:28px;overflow:hidden}
.ringbox svg{position:absolute;inset:0;width:100%;height:100%}
.ringbox #fig2d{transition:opacity .3s}
.stepbar{position:absolute;left:18px;right:18px;bottom:14px;height:5px;border-radius:9px;background:color-mix(in srgb,var(--c) 18%,transparent)}
.stepbar i{display:block;height:100%;width:0;border-radius:9px;background:var(--c)}
.nogl{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:20%;color:var(--muted);font-size:14px}
.tag{position:absolute;top:8%;font-family:var(--display);font-size:13px;font-weight:700;color:var(--c);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:2px 10px}
.info{text-align:center;display:grid;gap:2px}
.info h2{font-family:var(--display);font-weight:800;font-size:clamp(26px,8vw,34px);margin:0;line-height:1.15;text-wrap:balance}
.info p{margin:0;color:var(--muted);font-size:15px;min-height:1.5em;text-wrap:balance}
.big{display:flex;justify-content:center;align-items:baseline;gap:6px;font-family:var(--display);font-variant-numeric:tabular-nums;margin-top:6px;direction:ltr}
.big b{font-weight:800;font-size:clamp(54px,17vw,76px);line-height:1;color:var(--c)}
.big span{font-weight:500;font-size:22px;color:var(--muted)}
.unit{text-align:center;color:var(--muted);font-size:14px;font-family:var(--display)}
.upnext{text-align:center;font-size:14px;color:var(--muted);margin-top:6px;min-height:1.5em}
.upnext b{color:var(--ink)}
.controls{display:flex;justify-content:center;align-items:center;gap:22px;margin-top:10px}
.ctl{width:56px;height:56px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.play{width:78px;height:78px;border-radius:50%;border:0;background:var(--c);color:var(--on-accent);display:grid;place-items:center}
.ctl svg,.iconbtn svg{width:22px;height:22px}
.play svg{width:32px;height:32px}

.sheet{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(6px);display:grid;place-items:end center;padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:5;direction:rtl}
.sheet .card{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;display:grid;gap:10px}
.sheet h4{margin:0 0 4px;font-family:var(--display);font-size:20px}
.btn{border-radius:12px;padding:13px;font-family:var(--display);font-weight:700;font-size:17px;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--work);border-color:var(--work);color:var(--on-accent)}

/* Done */
#done{height:100%;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center;padding-block:24px}
#done h2{font-family:var(--display);font-weight:800;font-size:40px;margin:0}
#done .stats{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
#done .stats div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 18px;min-width:110px}
#done .stats b{display:block;font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums}
#done .stats small{color:var(--muted)}
@media (prefers-reduced-motion: reduce){.pbar i,#fig2d{transition:none}}
</style>

</head>
<body>
<div id="app">
  <section id="home">
    <div class="brand">
      <div class="brandtop"><small>אימון כוח ביתי</small><button class="iconbtn" id="themeBtn" type="button" aria-label="מעבר מצב תצוגה"></button></div>
      <h1>תוכנית אימון</h1>
      <div class="meta"><span id="metaTime">כ-30 דק'</span><span>3 סטים</span><span id="metaCount">20 תרגילים</span></div>
    </div>
    <div id="plan"></div>
    <div class="settings">
      <div class="set"><label>מנוחה בין תרגילים</label><div class="chips" data-key="restEx"></div></div>
      <div class="set"><label>מנוחה בין סטים</label><div class="chips" data-key="restRound"></div></div>
      <div class="set"><label>רטט במעבר שלב</label><div class="chips" data-key="vib"></div></div>
      <div class="set"><label>מראה</label><div class="chips" data-key="theme"></div></div>
    </div>
  </section>
  <div class="startbar" id="startbar"><button id="startBtn" type="button">יאללה, מתחילים</button></div>

  <section id="run" hidden>
    <div class="runbar">
      <button class="iconbtn" id="menuBtn" type="button" aria-label="תפריט"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="phase" id="phase">חימום</div>
      <div class="stepnum" id="stepnum">1/40</div>
    </div>
    <div class="pbar"><i id="pfill"></i></div>
    <div class="stage">
      <div class="ringbox" id="ringbox">
        <svg viewBox="0 0 220 220" aria-hidden="true" hidden><circle id="ringP" r="1"/></svg>
        <div class="stepbar"><i id="stepfill"></i></div>
        <svg id="fig2d" viewBox="-100 -190 200 200" aria-hidden="true"></svg>
        <div class="nogl" id="nogl" hidden>האנימציה לא נטענה. בדקו חיבור לאינטרנט ופתחו שוב.</div>
      </div>
      <div class="tag" id="tag" hidden>הבא בתור</div>
    </div>
    <div class="info"><h2 id="exName"></h2><p id="exCue"></p></div>
    <div class="big"><b id="bigNum">0</b><span id="bigOf"></span></div>
    <div class="unit" id="unit"></div>
    <div class="upnext" id="upnext"></div>
    <div class="controls">
      <button class="ctl" id="nextBtn" type="button" aria-label="דלג קדימה"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M17 5v14l-9-7zM7 5h-2v14h2z"/></svg></button>
      <button class="play" id="playBtn" type="button" aria-label="השהה"><svg id="playIco" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>
      <button class="ctl" id="prevBtn" type="button" aria-label="חזור אחורה"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5v14l9-7zM17 5h2v14h-2z"/></svg></button>
    </div>
  </section>

  <section id="done" hidden>
    <h2>סיימת את האימון</h2>
    <p style="margin:0;color:var(--muted)">3 סטים, חימום ומתיחות. כל הכבוד.</p>
    <div class="stats"><div><b id="dTime">0:00</b><small>זמן אימון</small></div><div><b id="dEx">0</b><small>תרגילים שבוצעו</small></div></div>
    <button class="btn primary" id="homeBtn" type="button">חזרה לתוכנית</button>
  </section>

  <div class="sheet" id="sheet" hidden>
    <div class="card">
      <h4>האימון מושהה</h4>
      <button class="btn primary" id="resumeBtn" type="button">המשך אימון</button>
      <button class="btn" id="quitBtn" type="button">סיום ויציאה לתוכנית</button>
    </div>
  </div>
</div>

<script>
(()=>{
/* ================= Pose authoring =================
   3D joints [fwd, up, lat]: fwd = direction the man faces, up = height above floor, lat = his left side.
   Lengths are re-imposed at runtime, so authored points only set directions. */
const J=['h','s','c','p','e1','a1','e2','a2','k1','f1','t1','k2','f2','t2'];
const P=(b,o)=>Object.assign({},b,o||{});
const isArm=j=>j[0]==='e'||j[0]==='a';
const mid3=(a,b,t)=>[0,1,2].map(i=>a[i]+(b[i]-a[i])*(t==null?.5:t));
function S3(p2,over){const o={};J.forEach(j=>{if(j==='c')return;const [x,y]=p2[j];const side=j.endsWith('1')?1:j.endsWith('2')?-1:0;o[j]=[x,180-y,side*(isArm(j)?19:8.5)]});
  o.c=p2.c?[p2.c[0],180-p2.c[1],0]:mid3(o.p,o.s,.47);return P(o,over)}
function F3(p2,over){const o={};J.forEach(j=>{if(j==='c')return;const [x,y]=p2[j];o[j]=[100,180-y,100-x]});
  ['1','2'].forEach(i=>{o['t'+i]=[113,180-p2['t'+i][1]+1,o['f'+i][2]]});o.c=mid3(o.p,o.s,.47);return P(o,over)}
const mix=(A,B,t)=>{const o={};J.forEach(j=>o[j]=mid3(A[j],B[j],t));return o};
const fixC=o=>P(o,{c:mid3(o.p,o.s,.47)});

const SIDE={h:[101,36],s:[100,58],p:[99,104],e1:[102,82],a1:[104,104],e2:[97,82],a2:[95,104],k1:[102,139],f1:[100,171],t1:[113,175],k2:[97,139],f2:[96,171],t2:[109,175]};
const FRONT={h:[100,36],s:[100,58],p:[100,104],e1:[84,83],a1:[82,105],e2:[116,83],a2:[118,105],k1:[93,139],f1:[92,171],t1:[89,176],k2:[107,139],f2:[108,171],t2:[111,176]};
const ST=S3(SIDE), FR=F3(FRONT);
const breathe=(o,k)=>P(o,{s:[o.s[0],o.s[1]+(k||1.2),o.s[2]],h:[o.h[0],o.h[1]+(k||1.2),o.h[2]]});
const HIPS={e1:[95,100,31],a1:[104,82,17],e2:[95,100,-31],a2:[104,82,-17]};
const FH=P(FR,HIPS);
const CAM={side:[.55,.26,.8],high:[.36,.5,.79],front:[.93,.18,.33],frontL:[.8,.2,.56]};
const A={};
A.stand={cam:'side',smooth:1,d:[1700,1700],poses:[ST,breathe(ST)]};

/* warm-up: generated circles */
const rad=Math.PI/180;
A.arms={cam:'side',smooth:1,poses:[],d:[]};
for(let i=0;i<8;i++){const t=i*45*rad,sx=Math.sin(t),cy=-Math.cos(t);
  A.arms.poses.push(P(FR,{e1:[100+24*sx,119+24*cy,20],a1:[100+46*sx,119+46*cy,21],e2:[100+24*sx,119+24*cy,-20],a2:[100+46*sx,119+46*cy,-21]}));A.arms.d.push(230)}
A.legs={cam:'front',smooth:1,poses:[],d:[]};
const KN=[[136,70,10],[130,70,24],[116,68,34],[104,62,38],[100,50,28],[104,44,16],[114,52,8],[128,62,6]];
[1,-1].forEach(sg=>{const n=sg>0?'1':'2';KN.forEach(k0=>{const k=[k0[0],k0[1],sg*k0[2]];const f=[k[0]-7,k[1]-34,k[2]+sg*2];
  A.legs.poses.push(P(FH,{['k'+n]:k,['f'+n]:f,['t'+n]:[f[0]+12,f[1]-3,f[2]]}));A.legs.d.push(270)})});
A.neck={cam:'front',smooth:1,poses:[],d:[]};
for(let i=0;i<8;i++){const t=i*45*rad;A.neck.poses.push(P(FH,{h:[100+20*.45*Math.cos(t),122+20,20*.45*Math.sin(t)]}));A.neck.d.push(450)}
const jjOpen=F3({h:[100,35],s:[100,57],p:[100,104],e1:[76,36],a1:[85,14],e2:[124,36],a2:[115,14],k1:[85,139],f1:[77,170],t1:[73,175],k2:[115,139],f2:[123,170],t2:[127,175]});
const jjMid=P(mix(FR,jjOpen,.5),{e1:[100,124,40],a1:[100,128,62],e2:[100,124,-40],a2:[100,128,-62]});
const jjLand=P(FR,{k1:[103,44,7],k2:[103,44,-7]});
A.jj={cam:'front',d:[190,190,190,190],air:[0,10,0,10],poses:[jjLand,jjMid,jjOpen,jjMid]};

/* main block */
const sqTop=S3(SIDE);
const sqMid=S3({h:[105,52],s:[99,74],c:[92,95],p:[86,116],e1:[115,80],a1:[134,76],e2:[113,82],a2:[132,78],k1:[112,138],f1:[100,171],t1:[113,175],k2:[108,139],f2:[96,171],t2:[109,175]},{k1:[112,42,11],k2:[108,41,-11]});
const sqBot=S3({h:[105,66],s:[95,86],c:[82,106],p:[71,126],e1:[118,88],a1:[140,87],e2:[116,90],a2:[138,89],k1:[112,132],f1:[100,171],t1:[113,175],k2:[108,133],f2:[96,171],t2:[109,175]},{k1:[112,48,13],k2:[108,47,-13]});
A.squat={cam:'side',rpc:1,d:[300,550,450,250,450,400],poses:[sqTop,sqTop,sqMid,sqBot,sqBot,sqMid]};

const puUp=S3({h:[165,127],s:[144,134],p:[94,150],e1:[144,155],a1:[144,176],e2:[141,155],a2:[141,176],k1:[66,159],f1:[38,168],t1:[44,178],k2:[64,160],f2:[36,169],t2:[42,178]},{a1:[144,4,22],a2:[144,4,-22],e1:[143,25,23],e2:[143,25,-23]});
const puDn=S3({h:[168,156],s:[146,160],p:[95,165],e1:[132,152],a1:[144,176],e2:[129,153],a2:[141,176],k1:[66,167],f1:[38,168],t1:[44,178],k2:[64,168],f2:[36,169],t2:[42,178]},{e1:[128,30,27],e2:[128,30,-27],a1:[144,4,21],a2:[144,4,-21]});
A.pushup={cam:'side',rpc:1,d:[250,450,450,150,400,350],poses:[puUp,puUp,mix(puUp,puDn),puDn,puDn,mix(puUp,puDn)]};

const hh=o=>P(o,{e1:[o.e1[0],o.e1[1],29],e2:[o.e2[0],o.e2[1],-29],a1:[o.a1[0],o.a1[1],16],a2:[o.a2[0],o.a2[1],-16]});
const lgStand=hh(S3(P(SIDE,{e1:[95,86],a1:[104,103],e2:[95,88],a2:[102,104]})));
const lgStepA=hh(S3({h:[102,38],s:[101,60],p:[99,107],e1:[95,88],a1:[104,105],e2:[95,90],a2:[102,106],k1:[94,140],f1:[76,158],t1:[82,169],k2:[104,141],f2:[101,171],t2:[114,175]}));

  }
  const LAG={squat:80,jj:28,arms:45,lunge:50,legs:40,neck:0,stand:0,pull:50,crunch:40};
  function lagged(a,id,t){
    const [o,air]=poseAt(a,t),lg=LAG[id.replace(/[LR]$/,'')];
    if(lg){const [q]=poseAt(a,t-lg);for(const j of ['a1','a2'])o[j]=lerp(o[j],q[j],.55);for(const j of ['e1','e2'])o[j]=lerp(o[j],q[j],.3);const [q2]=poseAt(a,t-lg*.6);o.h=lerp(o.h,q2.h,.5)}
    return [o,air];
  }
  function draw(id,t,snap,k){const a=A[id];const [o,air]=lagged(a,id,t);svg.innerHTML=figure(solve(o,air,a),a,id);frame(id,snap,k==null?.08:k)}
  function thumbs(){
    const pick={squat:3,pushup:3,lunge:2,pull:1,bridge:1,crunch:1,jj:2,arms:3,legs:1,neck:1},out={};
    Object.keys(A).forEach(id=>{const a=A[id];const [o,air]=poseAt(a,a.cum[pick[id]!=null?pick[id]:(a.poses.length>1?1:0)]);const f=fit(id),z=f[2]*.1;
      out[id]=`<svg data-id="${id}" viewBox="${[f[0]+z,f[1]+z*1.2,f[2]-2*z,f[2]-2*z].map(n1).join(' ')}" aria-hidden="true">${figure(solve(o,air,a),a,id)}</svg>`});
    return out;
  }
  function drawThumb(el,id,t){const a=A[id];const [o,air]=lagged(a,id,t);el.innerHTML=figure(solve(o,air,a),a,id)}
  return {draw,size(){},thumbs,drawThumb,setDark(){},isReady:()=>true};
}

let R3=null;try{R3=init2D();TH=R3.thumbs()}catch(e){console.error(e)}


/* ================= Theme ================= */
const ROOT=document.documentElement,HOST_THEME=ROOT.getAttribute('data-theme');
const mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
const isDark=()=>{const t=ROOT.getAttribute('data-theme');return t?t==='dark':!!(mq&&mq.matches)};
function applyTheme(){
  if(cfg.theme==='sys'){HOST_THEME?ROOT.setAttribute('data-theme',HOST_THEME):ROOT.removeAttribute('data-theme')}
  else ROOT.setAttribute('data-theme',cfg.theme);
  const d=isDark();
  const tb=$('themeBtn');if(tb){tb.innerHTML=d?SUN:MOON;tb.setAttribute('aria-label',d?'מעבר למצב בהיר':'מעבר למצב כהה')}
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',d?'#0F1417':'#EDF0EB');
  if(R3&&R3.setDark)R3.setDark(d);
}
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.3 14.6A8.5 8.5 0 0 1 9.4 3.7a8.5 8.5 0 1 0 10.9 10.9z"/></svg>';
if(mq&&mq.addEventListener)mq.addEventListener('change',()=>{if(cfg.theme==='sys')applyTheme()});

/* ================= Home ================= */
const PH={warm:['חימום','var(--warm)'],work:['גוף האימון · 3 סטים','var(--work)'],stretch:['מתיחות','var(--stretch)']};

function renderHome(){
  const sec=(key,arr)=>`<div class="sec" style="--c:${PH[key][1]}"><h3><i></i>${PH[key][0]}</h3><div class="list">${arr.map(e=>
    `<div class="row"><div class="thumb">${TH[e.id]||''}</div><b>${e.name}</b><em>${e.reps?e.m+(e.sub?'':' חזרות'):e.m}</em></div>`).join('')}</div></div>`;
  $('plan').innerHTML=sec('warm',WARM)+sec('work',MAIN)+sec('stretch',STRETCH);
  document.querySelectorAll('.chips').forEach(c=>{
    const k=c.dataset.key;
    c.innerHTML=OPTS[k].map(([v,l])=>`<button type="button" class="chip" aria-pressed="${cfg[k]==v}" data-v="${v}">${l}</button>`).join('');
  });
  build();
  $('metaCount').textContent=`${WARM.length+MAIN.length+STRETCH.length} תרגילים`;
  $('metaTime').textContent=`כ-${Math.round(steps.reduce((a,s)=>a+durOf(s),0)/60)} דק'`;
}
document.querySelector('.settings').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;
  const k=b.parentElement.dataset.key;cfg[k]=k==='theme'?b.dataset.v:+b.dataset.v;LS.set(k,cfg[k]);if(k==='theme')applyTheme();renderHome();
});

/* ================= Run ================= */
function buzz(ms){if(!cfg.vib)return;try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}}
async function wake(){try{await navigator.wakeLock.request('screen')}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!$('run').hidden)wake()});
const RING=2*Math.PI*104;
const S={i:0,el:0,anim:0,running:false,doneAt:null,lastSec:null,total:0,exDone:0,snap:true};
const PCOL={warm:'var(--warm)',work:'var(--work)',rest:'var(--rest)',stretch:'var(--stretch)',ready:'var(--ready)'};
function nextEx(i){for(let j=i+1;j<steps.length;j++)if(steps[j].kind==='ex')return steps[j];return null}
const measure=s=>s.reps?(s.sub||s.reps+' חזרות'):s.secs+' שניות';
const animFor=s=>s.kind==='rest'?(nextEx(S.i)||{anim:'stand'}).anim:s.anim;

function startStep(i){
  S.i=i;S.el=0;S.anim=0;S.doneAt=null;S.lastSec=null;
  const s=steps[i],nx=nextEx(i);
  $('run').style.setProperty('--c',PCOL[s.phase]);
  $('phase').textContent={warm:'חימום',work:`סט ${s.set} מתוך 3`,rest:'מנוחה',stretch:'מתיחות',ready:'היכונו'}[s.phase];
  $('stepnum').textContent=`${i+1}/${steps.length}`;
  $('pfill').style.width=(i/steps.length*100)+'%';
  if(s.kind==='rest'){
    $('exName').textContent=s.name;
    $('exCue').textContent=nx?`הבא: ${nx.name}${nx.side?' · '+nx.side:''} · ${measure(nx)}`:'';
    $('tag').hidden=false;$('fig2d').style.opacity=.55;$('upnext').innerHTML='';
  }else{
    $('exName').textContent=s.name+(s.side?' · '+s.side:'');
    $('exCue').textContent=s.cue||'';
    $('tag').hidden=true;$('fig2d').style.opacity=1;
    $('upnext').innerHTML=nx?`אחר כך: <b>${nx.name}</b>${nx.side?' · '+nx.side:''}`:'התרגיל האחרון';
  }
  $('unit').textContent=s.reps?(s.sub?'חזרות · '+s.sub:'חזרות · עקבו אחרי הקצב של הדמות'):'שניות נותרו';
  $('bigOf').textContent=s.reps?'/ '+s.reps:'';
  buzz(s.kind==='rest'?80:[60,60,60]);
  paint();
}
function advance(){
  if(steps[S.i].kind==='ex')S.exDone++;
  if(S.i+1>=steps.length)return finish();
  startStep(S.i+1);
}
function paint(){
  const s=steps[S.i];let frac;
  if(s.reps){
    const per=repMs(s.anim),c=Math.min(s.reps,Math.floor(S.anim/per));
    if(c>=s.reps&&S.doneAt==null){S.doneAt=S.el;buzz(200)}
    if(S.doneAt!=null)S.anim=Math.min(S.anim,s.reps*per);
    $('bigNum').textContent=c;frac=c/s.reps;
  }else{
    const rem=s.secs*1000-S.el,sec=Math.ceil(rem/1000);
    $('bigNum').textContent=s.secs>=60?fmt(rem/1000):Math.max(0,sec);
    if(sec<=3&&sec>0&&sec!==S.lastSec&&S.running){S.lastSec=sec;buzz(40)}
    frac=1-rem/(s.secs*1000);
  }
  $('stepfill').style.width=(100*Math.min(1,Math.max(0,frac))).toFixed(1)+'%';
  if(R3&&R3.isReady()){try{R3.draw(animFor(s),S.anim,S.snap);S.snap=false}catch(e){console.error(e)}}
}
let last=performance.now();
function loop(now){
  const dt=Math.min(100,now-last);last=now;
  if(!$('run').hidden){
    if(S.running){
      S.el+=dt;S.anim+=dt;S.total+=dt;
      const s=steps[S.i];paint();
      if(!s.reps&&S.el>=s.secs*1000)advance();
      else if(s.reps&&S.doneAt!=null&&S.el-S.doneAt>1300)advance();
    }else if(R3&&R3.isReady()){R3.draw(animFor(steps[S.i]),S.anim,false)}
  }
  requestAnimationFrame(loop);

let thumbLast=0;const RM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function thumbLoop(now){
  if(!RM&&R3&&R3.drawThumb&&!$('home').hidden&&now-thumbLast>40){thumbLast=now;
    document.querySelectorAll('.thumb svg[data-id]').forEach((el,i)=>{const r=el.getBoundingClientRect();if(r.bottom<0||r.top>innerHeight)return;R3.drawThumb(el,el.dataset.id,now+i*370)})}
  requestAnimationFrame(thumbLoop);
}
requestAnimationFrame(thumbLoop);
}
requestAnimationFrame(loop);

function setRunning(r){
  S.running=r;
  $('playIco').innerHTML=r?'<path d="M7 5h4v14H7zM13 5h4v14h-4z"/>':'<path d="M18 5v14L6 12z"/>';
  $('playBtn').setAttribute('aria-label',r?'השהה':'המשך');
}
function show(id){['home','run','done'].forEach(k=>$(k).hidden=k!==id);$('startbar').hidden=id!=='home';$('sheet').hidden=true;window.scrollTo(0,0);if(id==='run'&&R3)R3.size()}
function finish(){setRunning(false);show('done');$('dTime').textContent=fmt(S.total/1000);$('dEx').textContent=S.exDone;buzz([100,80,300])}

$('startBtn').onclick=()=>{build();S.total=0;S.exDone=0;S.snap=true;show('run');wake();startStep(0);setRunning(true)};
$('playBtn').onclick=()=>setRunning(!S.running);
$('nextBtn').onclick=()=>advance();
$('prevBtn').onclick=()=>{if(S.el>2500||S.i===0)startStep(S.i);else startStep(S.i-1)};
$('menuBtn').onclick=()=>{setRunning(false);$('sheet').hidden=false};
$('resumeBtn').onclick=()=>{$('sheet').hidden=true;setRunning(true)};
$('quitBtn').onclick=()=>{setRunning(false);show('home')};
$('homeBtn').onclick=()=>show('home');
$('themeBtn').onclick=()=>{cfg.theme=isDark()?'light':'dark';LS.set('theme',cfg.theme);applyTheme();renderHome()};
applyTheme();renderHome();
})();

</script>

<script>if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js").catch(()=>{});</script>
